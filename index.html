<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TE-CD01 — Industrial Digital CD Player PWA</title>
  <meta name="theme-color" content="#c8cacd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TE-CD01" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&display=swap');

    :root {
      --chassis-base: #c9cbce;
      --chassis-highlight: #d8dadc;
      --chassis-shadow: #9ea2a8;
      --led-red: #ff2a1f;
      --led-red-dim: rgba(255, 42, 31, 0.14);
      --led-red-glow: 0 0 8px rgba(255, 42, 31, 0.72), 0 0 18px rgba(255, 30, 20, 0.35);
      --disc-blue-1: #234c82;
      --disc-blue-2: #17345c;
      --disc-blue-3: #2b5a96;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 18%, #2b2f36 0%, #171a1f 55%, #0e1013 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #181a1d;
      overflow-x: hidden;
    }

    /* Brushed aluminum hardware chassis */
    .cd-chassis {
      position: relative;
      width: min(94vw, calc(88dvh * 0.715), 540px);
      aspect-ratio: 715 / 1000;
      flex-shrink: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.04) 14%, rgba(0,0,0,0.03) 86%, rgba(0,0,0,0.12) 100%),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.045) 0px,
          rgba(255,255,255,0.045) 1px,
          rgba(0,0,0,0.025) 1px,
          rgba(0,0,0,0.025) 2px
        ),
        linear-gradient(135deg, #d2d4d7 0%, #c6c8cb 48%, #bcc0c5 100%);
      border-radius: 6px;
      box-shadow:
        0 28px 65px rgba(0, 0, 0, 0.68),
        0 6px 16px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.72),
        inset 0 -2px 4px rgba(0, 0, 0, 0.22),
        inset 1px 0 1px rgba(255, 255, 255, 0.35),
        inset -1px 0 2px rgba(0, 0, 0, 0.16);
      overflow: hidden;
    }

    /* Fine micro-grain texture over chassis */
    .cd-chassis::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image: radial-gradient(rgba(255,255,255,0.45) 0.5px, transparent 0.5px),
                        radial-gradient(rgba(0,0,0,0.28) 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      background-position: 0 0, 1.5px 1.5px;
      z-index: 1;
    }

    /* Recessed circular pockets & optical well */
    .recess-pocket {
      position: absolute;
      border-radius: 9999px;
      background: linear-gradient(160deg, #9fa3a9 0%, #c7c9cc 55%, #dce0e4 100%);
      box-shadow:
        inset 0 3px 7px rgba(0, 0, 0, 0.34),
        inset 0 -1px 2px rgba(255, 255, 255, 0.55),
        0 1px 0 rgba(255, 255, 255, 0.55);
      pointer-events: none;
      z-index: 2;
    }

    .connector-hole {
      width: 2.55%;
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #3a3e44 0%, #16181b 68%, #090a0c 100%);
      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.78),
        inset 0 2px 4px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .connector-hole::after {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .screw-head {
      width: 1.85%;
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #e4e6e9 0%, #a8acb2 65%, #7d8187 100%);
      box-shadow:
        0 1px 1px rgba(255,255,255,0.7),
        inset 0 1px 2px rgba(0,0,0,0.45);
      position: relative;
      z-index: 3;
    }

    .screw-head::after {
      content: "";
      position: absolute;
      left: 22%;
      right: 22%;
      top: 47%;
      height: 1.2px;
      background: rgba(45, 48, 54, 0.65);
      transform: rotate(-28deg);
    }

    .silk-label {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #26292e;
      text-transform: uppercase;
      line-height: 1;
      pointer-events: none;
    }

    /* Rotating CD assembly */
    .cd-well-shadow {
      position: absolute;
      left: 36.5%;
      top: 10.5%;
      width: 58%;
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.34) 64%, rgba(0,0,0,0.12) 72%, transparent 76%);
      z-index: 4;
      pointer-events: none;
    }

    .cd-disc-wrapper {
      position: absolute;
      left: 36.5%;
      top: 10.5%;
      width: 58%;
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      z-index: 10;
      touch-action: none;
      cursor: grab;
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.42),
        0 2px 6px rgba(0, 0, 0, 0.3),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.28);
      will-change: transform;
    }

    .cd-disc-wrapper:active {
      cursor: grabbing;
    }

    .cd-blue-surface {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      background:
        conic-gradient(
          from 25deg at 50% 50%,
          rgba(255,255,255,0.08) 0deg,
          rgba(255,255,255,0.0) 55deg,
          rgba(120,185,255,0.14) 115deg,
          rgba(255,255,255,0.02) 185deg,
          rgba(255,255,255,0.11) 265deg,
          rgba(255,255,255,0.0) 360deg
        ),
        radial-gradient(circle at 50% 50%, var(--disc-blue-3) 0%, var(--disc-blue-1) 46%, var(--disc-blue-2) 100%);
    }

    .cd-cover-surface {
      width: 100%;
      height: 100%;
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      background-color: #16181c;
    }

    .cd-sheen-overlay {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, transparent 18%, rgba(255,255,255,0.06) 19%, transparent 20%, transparent 66%, rgba(255,255,255,0.08) 67%, transparent 68%),
        linear-gradient(125deg, rgba(255,255,255,0.18) 0%, transparent 38%, rgba(0,0,0,0.18) 100%);
    }

    .cd-center-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28.5%;
      height: 28.5%;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      z-index: 12;
      pointer-events: none;
      background:
        radial-gradient(circle at 38% 35%, #5b5f66 0%, #2d3035 58%, #181a1d 100%);
      box-shadow:
        0 2px 6px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        0 0 0 2px rgba(15, 17, 20, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cd-spindle-hole {
      width: 34%;
      height: 34%;
      border-radius: 9999px;
      background: radial-gradient(circle at 40% 35%, #1d2024 0%, #090a0c 85%);
      box-shadow:
        inset 0 2px 5px rgba(0, 0, 0, 0.95),
        0 1px 1px rgba(255, 255, 255, 0.25);
      border: 1.5px solid #6c7078;
    }

    /* Tactile grey square keypad buttons */
    .hw-key-grey {
      border-radius: 3px;
      background: linear-gradient(180deg, #d7d9dc 0%, #c2c5ca 100%);
      box-shadow:
        0 3px 0 #7f8389,
        0 4px 7px rgba(0, 0, 0, 0.34),
        inset 0 1px 1px rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(70, 74, 80, 0.35);
      color: #1f2226;
      font-family: 'Chakra Petch', 'Inter', sans-serif;
      font-weight: 600;
      transition: transform 60ms ease, box-shadow 60ms ease, filter 120ms ease;
      cursor: pointer;
    }

    .hw-key-grey:hover {
      filter: brightness(1.03);
    }

    .hw-key-grey:active,
    .hw-key-grey.is-pressed {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #7f8389,
        0 2px 3px rgba(0, 0, 0, 0.35),
        inset 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    .hw-key-black {
      border-radius: 3px;
      background: linear-gradient(180deg, #2d3035 0%, #17191c 100%);
      box-shadow:
        0 3px 0 #090a0c,
        0 5px 9px rgba(0, 0, 0, 0.45),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
      border: 1px solid #0c0d0f;
      color: #f0f2f5;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.08em;
      transition: transform 60ms ease, box-shadow 60ms ease;
      cursor: pointer;
    }

    .hw-key-black:active,
    .hw-key-black.is-pressed {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #090a0c,
        0 2px 4px rgba(0, 0, 0, 0.4),
        inset 0 1px 3px rgba(0, 0, 0, 0.6);
    }

    .hw-key-navy {
      border-radius: 3px;
      background: linear-gradient(180deg, #263956 0%, #142033
